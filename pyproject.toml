[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymollm"
version = "0.1.0"
description = "Natural-language PyMOL agent with multi-provider LLM tool calling"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "pymollm contributors" }]
# Zero hard deps: HTTP uses stdlib urllib (httpx optional). This installs cleanly
# into PyMOL.app, which often lacks pip / cannot build cryptography.
dependencies = []

[project.optional-dependencies]
http = ["httpx>=0.27"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["pymollm*"]
